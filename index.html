<div id="app"></div>
<div class="modal-bg" id="modal"></div>
<div class="toast" id="toast"></div>
<!-- Supabase cloud sync (optional). Loads the client, then our config. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
/* ============================================================
   Elliana The Shop — Clothing Store Management System
   Self-contained app. Starts empty; your data persists in the browser (localStorage).
   ============================================================ */

const DB_KEY = 'elliana_db_v3';
const SESSION_KEY = 'threadline_session_v1';
const REMEMBER_KEY = 'threadline_remember_v1';

/* ---------- Seed data ---------- */
function seedDB(){
  return {
    users:[
      {id:'u1', name:'Store Owner',  username:'admin', password:'admin123', role:'admin'}
    ],
    products:[],
    sales:[],
    nextSale:1001
  };
}

/* ---------- Persistence ---------- */
let DB;
function loadDB(){
  try{ const raw = localStorage.getItem(DB_KEY); DB = raw ? JSON.parse(raw) : seedDB(); }
  catch(e){ DB = seedDB(); }
  if(!DB.settings) DB.settings = { alertEmail:'', ccEmail:'', storeName:'Elliana The Shop', autoAlertOnLogin:true };
  if(DB.settings.storeName==='ThreadLine Store') DB.settings.storeName='Elliana The Shop';
}
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){} if(window.Cloud && Cloud.ready && !cloudApplying){ Cloud.saveState(DB); } }
/* set true while applying a remote update, so we don't echo it back */
let cloudApplying = false;
/* resilient key/value: localStorage first, cookie fallback when storage is blocked */
function ssGet(k){ try{ const v=localStorage.getItem(k); if(v!==null) return v; }catch(e){} try{ const m=document.cookie.match('(?:^|; )'+k+'=([^;]*)'); return m?decodeURIComponent(m[1]):null; }catch(e){} return null; }
function ssSet(k,v){ let ok=false; try{ localStorage.setItem(k,v); ok=true; }catch(e){} try{ document.cookie=k+'='+encodeURIComponent(v)+';path=/;max-age=31536000;samesite=lax'; }catch(e){} return ok; }
function ssDel(k){ try{ localStorage.removeItem(k); }catch(e){} try{ document.cookie=k+'=;path=/;max-age=0;samesite=lax'; }catch(e){} }
function saveSession(remember){
  if(remember){ ssSet(SESSION_KEY, session.id); try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} }
  else { try{ sessionStorage.setItem(SESSION_KEY, session.id); }catch(e){} ssDel(SESSION_KEY); }
}
function clearSession(){ ssDel(SESSION_KEY); try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} }

/* ---------- Session ---------- */
let session = null;   // {id,name,role,...}
let activeView = '';
let cart = {};        // productId -> qty  (POS)

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const money = n => 'MK' + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function stockBadge(p){ if(p.stock<=0) return '<span class="badge out">Out of stock</span>'; if(p.stock<=p.reorder) return '<span class="badge low">Low · '+p.stock+'</span>'; return '<span class="badge ok">'+p.stock+' in stock</span>'; }
/* ---------- Theme ---------- */
const THEME_KEY='threadline_theme';
let theme = (()=>{ try{ return localStorage.getItem(THEME_KEY)||'light'; }catch(e){ return 'light'; } })();
function applyTheme(){ document.documentElement.setAttribute('data-theme', theme==='dark'?'dark':'light'); }
function toggleTheme(){ theme = theme==='dark'?'light':'dark'; try{ localStorage.setItem(THEME_KEY,theme); }catch(e){} applyTheme(); if(session) renderApp(); else renderLogin(); }
const themeIcon = ()=> theme==='dark'?'☀️':'🌙';

function themeSwitch(id){ return `<button class="theme-switch" id="${id}" role="switch" aria-label="Toggle dark mode" title="Toggle dark / light mode"><span class="ti ti-sun">${SUN_SVG}</span><span class="ti ti-moon">${MOON_SVG}</span></button>`; }
applyTheme();

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

function renderLogin(err){
  app.innerHTML = `
  <div class="login-wrap">
    <button class="theme-switch login-theme" id="lgTheme" role="switch" aria-label="Toggle dark mode" title="Toggle dark / light mode"><span class="ti ti-sun">${SUN_SVG}</span><span class="ti ti-moon">${MOON_SVG}</span></button>
    <div class="login-split">
      <div class="login-aside">
        <div class="aside-badge">E</div>
        <h2>Welcome to Elliana</h2>
        <p class="aside-tag">Your all-in-one clothing store management system — track inventory, ring up sales, and keep your team in sync.</p>
        <ul>
          <li><span class="tick">✓</span> Real-time inventory &amp; low-stock alerts</li>
          <li><span class="tick">✓</span> Fast point-of-sale checkout</li>
          <li><span class="tick">✓</span> Sales history &amp; team reports</li>
        </ul>
      </div>
      <div class="login-card">
      <div class="brand brand-logo"><img src="${LOGO_FULL}" alt="Elliana" class="login-logo-img"></div>
      <p class="login-sub">Clothing Store Management</p>
      <div class="role-toggle">
        <button data-role="admin" class="${loginRole==='admin'?'active':''}">${IC_ADMIN} Admin</button>
        <button data-role="sales" class="${loginRole==='sales'?'active':''}">${IC_BAG} Salesperson</button>
      </div>
      ${err?`<div class="login-err">${esc(err)}</div>`:''}
      <form id="loginForm">
        <div class="field"><label>Username</label><div class="input-ico"><span class="lead">${IC_USER}</span><input id="lgUser" autocomplete="username" placeholder="Enter username"></div></div>
        <div class="field"><label>Password</label><div class="input-ico"><span class="lead">${IC_LOCK}</span><input id="lgPass" type="password" autocomplete="current-password" placeholder="Enter password"><button type="button" class="pw-toggle" id="lgPwToggle" aria-label="Show password">${IC_EYE}</button></div></div>
        <div class="field" style="display:flex;align-items:center;gap:8px;margin-bottom:18px">
          <input type="checkbox" id="lgRemember" ${rememberMe?'checked':''} style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0;flex:none">
          <label for="lgRemember" style="margin:0;font-size:13px;color:var(--text);cursor:pointer;font-weight:500">Remember me on this device</label>
        </div>
        <button type="submit" class="btn-primary">${IC_LOGIN} Sign in as ${loginRole==='admin'?'Admin':'Salesperson'}</button>
      </form>
      <button type="button" id="fpLink" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;margin-top:16px;text-decoration:underline">Forgot password?</button>
      </div>
    </div>
  </div>`;
  app.querySelectorAll('.role-toggle button').forEach(b=>b.onclick=()=>{ loginRole=b.dataset.role; renderLogin(); });
  { const fl=$('#fpLink'); if(fl) fl.onclick=()=>{ fpStep=1; fpUser=null; renderForgot(); }; }
  $('#lgTheme').onclick=toggleTheme;
  const pwBtn=$('#lgPwToggle');
  if(pwBtn){ pwBtn.onclick=()=>{ const pw=$('#lgPass'); const show=pw.type==='password'; pw.type=show?'text':'password'; pwBtn.innerHTML=show?IC_EYEOFF:IC_EYE; pwBtn.setAttribute('aria-label',show?'Hide password':'Show password'); pw.focus(); }; }
  $('#loginForm').onsubmit = e=>{
    e.preventDefault();
    const u=$('#lgUser').value.trim(), p=$('#lgPass').value;
    const user = DB.users.find(x=>x.username===u && x.password===p);
    if(!user){ renderLogin('Invalid username or password.'); return; }
    if(user.role!==loginRole){ renderLogin('This account is a '+user.role+' account. Switch the login tab above.'); return; }
    const remember = !!($('#lgRemember') && $('#lgRemember').checked);
    rememberMe = remember;
    try{ localStorage.setItem(REMEMBER_KEY, remember?'1':'0'); }catch(e){}
    session = user;
    saveSession(remember);
    activeView = user.role==='admin' ? 'dashboard' : 'pos';
    renderApp();
    maybeAutoAlert();
  };
}

/* ---------- Forgot-password recovery (offline, email-on-file verification) ---------- */
let fpStep = 1;      // 1 = identify, 2 = set new password
let fpUser = null;   // matched user record
function renderForgot(err, info){
  app.innerHTML = `
  <div class="login-wrap">
    <button class="theme-switch login-theme" id="lgTheme" role="switch" aria-label="Toggle dark mode" title="Toggle dark / light mode"><span class="ti ti-sun">${SUN_SVG}</span><span class="ti ti-moon">${MOON_SVG}</span></button>
    <div class="login-card">
      <div class="brand brand-logo"><img src="${LOGO_FULL}" alt="Elliana" class="login-logo-img"></div>
      <p class="login-sub">Reset your password</p>
      ${err?`<div class="login-err">${esc(err)}</div>`:''}
      ${info?`<div class="login-err" style="background:var(--accent-soft);color:var(--accent)">${esc(info)}</div>`:''}
      ${ fpStep===1 ? `
      <form id="fpForm1">
        <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 14px">Enter your username and the email saved on your account. We'll check them against your records so you can set a new password \u2014 all on this device.</p>
        <div class="field"><label>Username</label><div class="input-ico"><span class="lead">${IC_USER}</span><input id="fpU" autocomplete="username" placeholder="Enter username"></div></div>
        <div class="field"><label>Email on file</label><div class="input-ico"><span class="lead">${IC_LOCK}</span><input id="fpE" type="email" placeholder="you@example.com"></div></div>
        <button type="submit" class="btn-primary">${IC_LOGIN} Verify account</button>
      </form>` : `
      <form id="fpForm2">
        <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 14px">Identity verified for <b>@${esc(fpUser.username)}</b>. Choose a new password.</p>
        <div class="field"><label>New password</label><div class="input-ico"><span class="lead">${IC_LOCK}</span><input id="fpN" type="password" placeholder="At least 4 characters"></div></div>
        <div class="field"><label>Confirm new password</label><div class="input-ico"><span class="lead">${IC_LOCK}</span><input id="fpN2" type="password" placeholder="Re-enter new password"></div></div>
        <button type="submit" class="btn-primary">${IC_LOGIN} Set new password</button>
      </form>`}
      <button type="button" id="fpBack" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;margin-top:16px;text-decoration:underline">\u2190 Back to sign in</button>
    </div>
  </div>`;
  $('#lgTheme').onclick=toggleTheme;
  $('#fpBack').onclick=()=>{ fpStep=1; fpUser=null; renderLogin(); };
  if(fpStep===1){
    $('#fpForm1').onsubmit=e=>{
      e.preventDefault();
      const u=$('#fpU').value.trim(), em=$('#fpE').value.trim().toLowerCase();
      const user=DB.users.find(x=>x.username===u);
      if(!user){ renderForgot('No account found with that username.'); return; }
      if(!user.email){ renderForgot('This account has no recovery email on file. Please ask an admin to reset your password from the Staff page.'); return; }
      if(user.email.toLowerCase()!==em){ renderForgot('That email does not match the one on file for this account.'); return; }
      fpUser=user; fpStep=2; renderForgot();
    };
  } else {
    $('#fpForm2').onsubmit=e=>{
      e.preventDefault();
      const nw=$('#fpN').value, nw2=$('#fpN2').value;
      if(nw.length<4){ renderForgot('New password must be at least 4 characters.'); return; }
      if(nw!==nw2){ renderForgot('The two passwords do not match.'); return; }
      fpUser.password=nw; saveDB();
      fpStep=1; fpUser=null;
      renderLogin(); toast('Password updated \u2014 sign in with your new password');
    };
  }
}

function logout(){ session=null; cart={}; loginRole='admin'; clearSession(); renderLogin(); }

function closeDrawer(){ const s=$('#sidebar'),o=$('#overlay'); if(s)s.classList.remove('open'); if(o)o.classList.remove('show'); document.body.style.overflow=''; }

function renderView(){
  const c = $('#content'); if(!c) return;
  switch(activeView){
    case 'dashboard': return viewDashboard(c);
    case 'execsummary': return viewExecSummary(c);
    case 'inventory': return viewInventory(c);
    case 'sales':     return viewSalesHistory(c, false);
    case 'staff':     return viewStaff(c);
    case 'alerts':    return viewAlerts(c);
    case 'reports':   return viewReports(c);
    case 'pos':       return viewPOS(c);
    case 'catalog':   return viewCatalog(c);
    case 'mysales':   return viewSalesHistory(c, true);
    case 'profile':   return viewProfile(c);
  }
}

/* ---------- shared metrics ---------- */
function salesStats(filterUser){
  const list = filterUser ? DB.sales.filter(s=>s.cashier===filterUser) : DB.sales;
  const revenue = list.reduce((a,s)=>a+s.total,0);
  const units = list.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty,0),0);
  return {list, revenue, units, count:list.length, avg: list.length? revenue/list.length : 0};
}

// Build a one-page, print-optimized executive summary that consolidates the
// dashboard's headline KPIs, highlights and category mix from live data.
function viewExecSummary(c){
  const PAL=['#3658d6','#6f93f7','#12b76a','#f0b24a','#f0455b','#8b5cf6','#06b6d4','#64748b'];
  const st = salesStats();
  const invValue = DB.products.reduce((a,p)=>a+p.stock*p.cost,0);
  const lowCount = DB.products.filter(p=>p.stock>0 && p.stock<=p.reorder).length;
  const outCount = DB.products.filter(p=>p.stock<=0).length;
  const alerts = lowCount+outCount;
  // estimated gross profit from sold items (qty x (price - cost))
  let profit=0;
  (DB.sales||[]).forEach(s=>s.items.forEach(it=>{ const p=DB.products.find(pr=>pr.id===it.id); profit+=it.qty*(it.price-(p?p.cost:0)); }));
  const margin = st.revenue? profit/st.revenue*100 : 0;
  // best seller
  const soldMap={};
  (DB.sales||[]).forEach(s=>s.items.forEach(i=>{ soldMap[i.name]=(soldMap[i.name]||0)+i.qty; }));
  const bestEntry = Object.entries(soldMap).sort((a,b)=>b[1]-a[1])[0];
  // revenue by category
  const catRev={};
  (DB.sales||[]).forEach(s=>s.items.forEach(it=>{ const p=DB.products.find(pr=>pr.id===it.id); const cat=p?p.cat:'Other'; catRev[cat]=(catRev[cat]||0)+it.qty*it.price; }));
  const catRows=Object.entries(catRev).sort((a,b)=>b[1]-a[1]);
  const catTotal=catRows.reduce((a,r)=>a+r[1],0);
  const catMax=catRows.length?catRows[0][1]:1;
  // top salesperson
  const repMap={};
  (DB.sales||[]).forEach(s=>{ repMap[s.cashierName]=(repMap[s.cashierName]||0)+s.total; });
  const topRep = Object.entries(repMap).sort((a,b)=>b[1]-a[1])[0];
  const store = esc((DB.settings&&DB.settings.storeName)||'Elliana The Shop');
  const now = new Date();
  const ek=(l,v,s)=>`<div class="exec-kpi"><div class="ek-l">${l}</div><div class="ek-v">${v}</div><div class="ek-s">${s}</div></div>`;
  const hl=(ico,k,v)=>`<li><span class="hl-ico">${ico}</span><span class="hl-k">${k}</span><span class="hl-v">${v}</span></li>`;
  const catBars = catRows.length? catRows.slice(0,6).map((r,i)=>{
    const w=(r[1]/catMax*100), pct=catTotal?(r[1]/catTotal*100):0, col=PAL[i%PAL.length];
    return `<div class="ec-row"><div class="ec-name">${esc(r[0])}</div><div class="ec-track"><div class="ec-fill" style="width:${w.toFixed(1)}%;background:${col}"></div></div><div class="ec-val">${pct.toFixed(0)}%</div></div>`;
  }).join('') : '<div class="empty">No sales yet</div>';
  const callout = alerts>0
    ? `<div class="exec-callout warn"><div class="co-ico">⚠️</div><div><b>${alerts} product(s) need restocking</b><br><span>${lowCount} low · ${outCount} out of stock — review the Low-Stock Alerts page to reorder.</span></div></div>`
    : `<div class="exec-callout ok"><div class="co-ico">✅</div><div><b>Inventory is healthy</b><br><span>No products are currently low or out of stock.</span></div></div>`;
  c.innerHTML = `
    <div class="exec-view">
    <div class="exec-actions">
      <button class="btn ghost" id="execBack">‹ Back to Dashboard</button>
      <div class="ea-right"><button class="btn primary" id="execPrint">🖨 Print / Save as PDF</button></div>
    </div>
    <div class="exec-sheet">
      <div class="exec-head">
        <div><h2>${store}</h2><div class="eh-sub">Executive Summary — business at a glance</div></div>
        <div class="eh-date">${esc(now.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}))}</div>
      </div>
      <div class="exec-body">
        <div class="exec-section-t">Headline Metrics</div>
        <div class="exec-kpis">
          ${ek('Total Revenue', money(st.revenue), st.count+' transactions')}
          ${ek('Units Sold', st.units, 'Avg sale '+money(st.avg))}
          ${ek('Est. Gross Profit', money(profit), margin.toFixed(0)+'% margin')}
          ${ek('Inventory Value', money(invValue), DB.products.length+' products')}
        </div>
        <div class="exec-cols" style="margin-top:22px">
          <div>
            <div class="exec-section-t">Highlights</div>
            <ul class="exec-hl">
              ${hl('🏆','Best seller', bestEntry? esc(bestEntry[0])+' · '+bestEntry[1]+' sold' : '—')}
              ${hl('📈','Top category', catRows.length? esc(catRows[0][0])+' · '+money(catRows[0][1]) : '—')}
              ${hl('🧑‍💼','Top salesperson', topRep? esc(topRep[0])+' · '+money(topRep[1]) : '—')}
              ${hl('🧾','Transactions', st.count+' · avg '+money(st.avg))}
              ${hl('⚠️','Stock alerts', alerts+' item(s)')}
            </ul>
          </div>
          <div>
            <div class="exec-section-t">Revenue by Category</div>
            <div class="exec-cat">${catBars}</div>
          </div>
        </div>
        <div class="exec-section-t">Inventory Health</div>
        ${callout}
      </div>
      <div class="exec-foot">Prepared from live in-browser data · ${esc(now.toLocaleString())}. Use Print / Save as PDF to export this one-page summary.</div>
    </div>
    </div>`;
  { const b=$('#execBack'); if(b) b.onclick=()=>{ activeView='dashboard'; renderApp(); }; }
  { const p=$('#execPrint'); if(p) p.onclick=()=>window.print(); }
}

// Build an inline-SVG combo chart: revenue (bars) + units sold (line)
// over the last 14 days, computed from live sales data. Theme-aware via CSS.
function trendChartSVG(){
  const sales = DB.sales||[];
  const DAY=86400000, days=14;
  const anchor = sales.length? Math.max.apply(null, sales.map(s=>s.ts)) : Date.now();
  const end = new Date(anchor); end.setHours(0,0,0,0);
  const buckets=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date(end.getTime()-i*DAY);
    buckets.push({ d, label:d.toLocaleDateString(undefined,{month:'short',day:'numeric'}), rev:0, units:0 });
  }
  const startMs = buckets[0].d.getTime();
  sales.forEach(s=>{
    const sd=new Date(s.ts); sd.setHours(0,0,0,0);
    const idx=Math.round((sd.getTime()-startMs)/DAY);
    if(idx>=0 && idx<days){ buckets[idx].rev+=s.total; buckets[idx].units+=s.items.reduce((a,i)=>a+i.qty,0); }
  });
  const hasData = buckets.some(b=>b.rev>0||b.units>0);
  const revMax=Math.max(1,...buckets.map(b=>b.rev));
  const uniMax=Math.max(1,...buckets.map(b=>b.units));
  const W=760,H=280, pl=54,pr=22,pt=26,pb=42;
  const pw=W-pl-pr, ph=H-pt-pb, n=buckets.length, slot=pw/n, bw=slot*0.5;
  const yUni=v=>pt+ph-(v/uniMax)*ph;
  const cx=i=>pl+slot*i+slot/2;
  let grid='';
  for(let g=0;g<=4;g++){
    const gy=pt+ph-(ph*g/4), val=revMax*g/4;
    grid+=`<line class="tc-grid" x1="${pl}" y1="${gy.toFixed(1)}" x2="${W-pr}" y2="${gy.toFixed(1)}"/>`;
    grid+=`<text class="tc-axis" x="${pl-9}" y="${(gy+3.5).toFixed(1)}" text-anchor="end">${money(Math.round(val))}</text>`;
  }
  const bars=buckets.map((b,i)=>{
    const h=(b.rev/revMax)*ph, x=cx(i)-bw/2, y=pt+ph-h;
    return `<rect class="tc-bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3"><title>${b.label}: ${money(b.rev)} revenue</title></rect>`;
  }).join('');
  const pts=buckets.map((b,i)=>`${cx(i).toFixed(1)},${yUni(b.units).toFixed(1)}`).join(' ');
  const line=`<polyline class="tc-line" points="${pts}" fill="none"/>`;
  const dots=buckets.map((b,i)=>`<circle class="tc-dot" cx="${cx(i).toFixed(1)}" cy="${yUni(b.units).toFixed(1)}" r="3.6"><title>${b.label}: ${b.units} units</title></circle>`).join('');
  const step=n>7?2:1;
  const xl=buckets.map((b,i)=> (i%step===0)?`<text class="tc-axis" x="${cx(i).toFixed(1)}" y="${H-pb+18}" text-anchor="middle">${b.label}</text>`:'').join('');
  const peak=`<text class="tc-axis" x="${W-pr}" y="${pt-10}" text-anchor="end">peak ${uniMax} units/day</text>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" class="tc-svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Revenue and units sold trend over the last ${days} days">${grid}${peak}${bars}${line}${dots}${xl}</svg>`;
  return `<div class="panel trend-panel">
    <div class="panel-head"><h4>Revenue &amp; Units Trend</h4>
      <div class="tc-legend"><span class="lg lg-rev">Revenue</span><span class="lg lg-uni">Units sold</span></div>
    </div>
    <div class="panel-body">${hasData?svg:'<div class="empty">No sales in the last '+days+' days yet</div>'}</div>
  </div>`;
}

// Horizontal bar breakdown of revenue grouped by product category,
// computed live from sales (qty x price), with share percentages.
function categoryBreakdown(){
  const PAL=['#3658d6','#6f93f7','#12b76a','#f0b24a','#f0455b','#8b5cf6','#06b6d4','#64748b'];
  const catRev={};
  (DB.sales||[]).forEach(s=>s.items.forEach(it=>{
    const p=DB.products.find(pr=>pr.id===it.id);
    const cat=p? p.cat : 'Other';
    catRev[cat]=(catRev[cat]||0)+it.qty*it.price;
  }));
  const rows=Object.entries(catRev).sort((a,b)=>b[1]-a[1]);
  const total=rows.reduce((a,r)=>a+r[1],0);
  const max=rows.length? rows[0][1] : 1;
  const body = rows.length? rows.map((r,i)=>{
    const pct = total? (r[1]/total*100) : 0;
    const w = (r[1]/max*100);
    const col = PAL[i%PAL.length];
    return `<div class="cat-row"><div class="cat-name">${esc(r[0])}</div><div class="cat-track"><div class="cat-fill" style="width:${w.toFixed(1)}%;background:${col}"></div></div><div class="cat-val">${money(r[1])}<span class="cat-pct">${pct.toFixed(0)}%</span></div></div>`;
  }).join('') : '<div class="empty">No sales yet</div>';
  return `<div class="panel">
    <div class="panel-head"><h4>Revenue by Category</h4>${rows.length?`<span class="cat-total">Total ${money(total)}</span>`:''}</div>
    <div class="panel-body cat-body">${body}</div>
  </div>`;
}

/* ---------- CSV bulk import ---------- */
// minimal RFC-4180-ish parser (handles quotes, commas, newlines in quotes)
function parseCSV(text){
  text=text.replace(/^\uFEFF/,''); // strip BOM
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else field+=ch;
    } else {
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(field); field=''; }
      else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(ch==='\r'){ /* skip */ }
      else field+=ch;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

function importCSV(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let rows;
    try{ rows=parseCSV(reader.result); }catch(e){ toast('Could not read that file'); return; }
    if(rows.length<2){ toast('No data rows found in the CSV'); return; }
    const header=rows[0].map(h=>h.trim().toLowerCase().replace(/\s+/g,'_'));
    const col=names=>{ for(const n of names){ const i=header.indexOf(n); if(i>-1) return i; } return -1; };
    const idx={
      name:col(['name','product','product_name']),
      sku:col(['sku','code']),
      cat:col(['category','cat']),
      emoji:col(['emoji','icon']),
      price:col(['price','sell_price','selling_price']),
      cost:col(['cost','unit_cost']),
      stock:col(['stock','quantity','qty']),
      reorder:col(['reorder_level','reorder','reorder_point'])
    };
    if(idx.name<0){ toast('CSV must have a "name" column'); return; }
    const parsed=[]; const errors=[];
    for(let r=1;r<rows.length;r++){
      const cells=rows[r]; const g=i=>i>-1&&i<cells.length?cells[i].trim():'';
      const name=g(idx.name);
      if(!name){ errors.push('Row '+(r+1)+': missing name'); continue; }
      parsed.push({
        name,
        sku:g(idx.sku)||'—',
        cat:g(idx.cat)||'Uncategorized',
        emoji:g(idx.emoji)||'👕',
        price:parseFloat(g(idx.price))||0,
        cost:parseFloat(g(idx.cost))||0,
        stock:parseInt(g(idx.stock))||0,
        reorder:parseInt(g(idx.reorder))||10
      });
    }
    if(!parsed.length){ toast('No valid rows to import'); return; }
    confirmImport(parsed, errors);
  };
  reader.onerror=()=>toast('Failed to read file');
  reader.readAsText(file);
}

function confirmImport(parsed, errors){
  // detect SKU matches against existing products (update vs add)
  const bySku={}; DB.products.forEach(p=>{ if(p.sku&&p.sku!=='—') bySku[p.sku.toLowerCase()]=p; });
  let updates=0, adds=0;
  parsed.forEach(p=>{ if(bySku[p.sku.toLowerCase()]) updates++; else adds++; });
  const preview=parsed.slice(0,8);
  openModal('Confirm Bulk Import',`
    <p style="margin-bottom:14px">Ready to import <b>${parsed.length}</b> product${parsed.length>1?'s':''} — <b>${adds}</b> new, <b>${updates}</b> updated (matched by SKU).</p>
    ${errors.length?`<div class="login-err" style="text-align:left;margin-bottom:14px">${errors.length} row(s) skipped:<br>${errors.slice(0,5).map(esc).join('<br>')}${errors.length>5?'<br>…':''}</div>`:''}
    <div class="tbl-wrap" style="border:1px solid var(--border);border-radius:8px;max-height:260px;overflow:auto">
      <table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th></tr></thead><tbody>
        ${preview.map(p=>`<tr><td>${p.emoji} ${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${money(p.price)}</td><td>${p.stock}</td></tr>`).join('')}
      </tbody></table>
    </div>
    ${parsed.length>8?`<p style="color:var(--muted);font-size:12px;margin-top:10px">…and ${parsed.length-8} more.</p>`:''}`,
    [{label:'Cancel',cls:'ghost',act:closeModal},{label:'Import '+parsed.length+' product'+(parsed.length>1?'s':''),cls:'primary',act:()=>{
      parsed.forEach(p=>{ const ex=bySku[p.sku.toLowerCase()]; if(ex) Object.assign(ex,p); else DB.products.push({id:'p'+Date.now()+Math.floor(Math.random()*9999),...p}); });
      saveDB(); closeModal(); toast('Imported '+parsed.length+' product'+(parsed.length>1?'s':''));
      renderView();
    }}]);
}

function lowStockItems(){
  return DB.products
    .filter(p=>p.stock<=p.reorder)
    .sort((a,b)=>(a.stock/ (a.reorder||1)) - (b.stock/(b.reorder||1)));
}
// Build a plain-text alert body (also used for the email)
function buildAlertText(){
  const items=lowStockItems();
  const d=new Date().toLocaleString();
  let t=`Low-Stock Alert — ${DB.settings.storeName}\nGenerated: ${d}\n\n`;
  if(!items.length){ t+='All products are above their reorder levels. No action needed.'; return t; }
  t+=`${items.length} product(s) need restocking:\n\n`;
  items.forEach(p=>{
    const status=p.stock<=0?'OUT OF STOCK':'LOW';
    t+=`- ${p.name} (SKU ${p.sku}) — ${status}: ${p.stock} in stock, reorder level ${p.reorder}\n`;
  });
  t+=`\nSuggested action: reorder the items above.\n\n— Sent from ${DB.settings.storeName} inventory system`;
  return t;
}
function buildMailto(){
  const s=DB.settings;
  const items=lowStockItems();
  const subject=`[Low-Stock Alert] ${items.length} item(s) need restocking — ${s.storeName}`;
  const params=[];
  params.push('subject='+encodeURIComponent(subject));
  params.push('body='+encodeURIComponent(buildAlertText()));
  if(s.ccEmail) params.push('cc='+encodeURIComponent(s.ccEmail));
  return 'mailto:'+encodeURIComponent(s.alertEmail)+'?'+params.join('&');
}
// One-click low-stock email: validate, then open a ready-to-send email.
function sendLowStockAlert(){
  const items=lowStockItems();
  if(!items.length){ toast('🎉 Nothing is low on stock right now'); return; }
  if(!DB.settings.alertEmail){ toast('Set a recipient email in Low-Stock Alerts first'); activeView='alerts'; renderApp(); return; }
  toast('✉ Opening email for '+items.length+' low-stock item(s)…');
  window.location.href=buildMailto();
}

          <div><label class="lbl">CC (optional)</label><input class="inp" id="a_cc" type="email" placeholder="owner@store.com" value="${esc(s.ccEmail)}"></div>

        </div>
        <div class="toolbar" style="margin-top:18px">
          <button class="btn primary" id="a_save">Save Settings</button>

          “Send Alert Email” opens your email app with a ready-to-send message (recipient, subject and the full low-stock list pre-filled) — you just press send. This works entirely offline with no server.<br>
          For fully automatic, scheduled emails (sent without anyone logging in) a small backend mail service is required — see the note I’ll give you.
        </p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h4>Items Needing Restock</h4><button class="btn ghost sm" id="a_inv">Go to Inventory</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>In Stock</th><th>Reorder Level</th><th>Status</th></tr></thead><tbody>
        ${items.length?items.map(p=>`<tr>
          <td><div class="prod-cell"><div class="prod-thumb">${p.emoji}</div><div><div class="pname">${esc(p.name)}</div><div class="psku">${esc(p.sku)}</div></div></div></td>
          <td>${esc(p.cat)}</td><td><b>${p.stock}</b></td><td style="color:var(--muted)">${p.reorder}</td><td>${stockBadge(p)}</td>
        </tr>`).join(''):'<tr><td colspan="5"><div class="empty">🎉 Everything is well stocked — no alerts right now.</div></td></tr>'}
      </tbody></table></div>
    </div>
    </div>`;

  $('#a_save').onclick=()=>{
    s.storeName=$('#a_store').value.trim()||'Elliana The Shop';
    s.alertEmail=$('#a_email').value.trim();
    s.ccEmail=$('#a_cc').value.trim();
    s.autoAlertOnLogin=$('#a_auto').value==='1';
    saveDB(); toast('Settings saved'); viewAlerts(c);
  };
  const sendBtn=$('#a_send');
  if(sendBtn && !sendBtn.disabled) sendBtn.onclick=sendLowStockAlert;
  $('#a_copy').onclick=()=>{
    const txt=buildAlertText();
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('Alert text copied'),()=>fallbackCopy(txt)); }
    else fallbackCopy(txt);
  };
  $('#a_inv').onclick=()=>{ activeView='inventory'; renderApp(); };
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Alert text copied'); }catch(e){ toast('Copy not supported — select manually'); }
  document.body.removeChild(ta);
}

/* Auto-check: when an admin logs in, flag low stock */

}

      <div class="kpi"><div class="k-ico">📉</div><div class="k-label">Margin</div><div class="k-val">${st.revenue?Math.round(grossProfit/st.revenue*100):0}%</div><div class="k-sub">Profit / revenue</div></div>

/* ============================================================
   SALESPERSON — POS (New Sale)
   ============================================================ */
let posSearch='';
let posScanFocus=false, scanStream=null, scanRAF=null;
// Match a scanned/typed code against product SKU (or optional barcode field)
function findByCode(code){
  if(!code) return null;
  const c=code.trim().toLowerCase();
  const norm=x=>String(x||'').toLowerCase().replace(/[-\s]/g,'');
  return DB.products.find(p=> (p.sku&&p.sku.toLowerCase()===c) || (p.barcode&&String(p.barcode).toLowerCase()===c))
      || DB.products.find(p=> norm(p.sku)===norm(c) || (p.barcode&&norm(p.barcode)===norm(c)));
}
// Quick-add a product to the cart from a scanned/typed code
function scanAdd(code,c){
  const p=findByCode(code);
  if(!p){ toast('✗ No product matches “'+code+'”'); return false; }
  if(p.stock<=0){ toast(p.name+' is out of stock'); return false; }
  const cur=cart[p.id]||0;
  if(cur>=p.stock){ toast('Only '+p.stock+' of '+p.name+' in stock'); return false; }
  cart[p.id]=cur+1; toast('✓ Added '+p.name+' ('+p.sku+')'); viewPOS(c); return true;
}
// Optional camera scanning via the native BarcodeDetector API (where available)
async function openScanner(c){
  if(!('BarcodeDetector' in window)){ toast('Camera scan not supported here — use a handheld scanner or type the SKU'); const sc=$('#posScan'); if(sc) sc.focus(); return; }
  openModal('📷 Scan a barcode','<div class="scanview"><video id="scanVid" playsinline muted></video><div class="scanline"></div></div><p id="scanMsg" style="color:var(--muted);font-size:13px;margin-top:12px;text-align:center">Point the camera at a product barcode…</p>',[{label:'Cancel',cls:'ghost',act:closeModal}]);
  try{
    const detector=new BarcodeDetector({formats:['ean_13','ean_8','code_128','code_39','upc_a','upc_e','itf','qr_code']});
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const vid=$('#scanVid'); if(!vid){ closeModal(); return; }
    vid.srcObject=scanStream; await vid.play();
    const tick=async()=>{
      if(!scanStream) return;
      try{
        const codes=await detector.detect(vid);
        if(codes&&codes.length){
          const raw=codes[0].rawValue;
          if(findByCode(raw)){ closeModal(); posScanFocus=true; scanAdd(raw,c); return; }
          const m=$('#scanMsg'); if(m) m.textContent='Unknown code: '+raw+' — no matching product';
        }
      }catch(e){}
      scanRAF=requestAnimationFrame(tick);
    };
    scanRAF=requestAnimationFrame(tick);
  }catch(err){ const m=$('#scanMsg'); if(m) m.textContent='Camera unavailable: '+((err&&err.message)||'permission denied'); }
}
function viewPOS(c){
  const q=posSearch.toLowerCase();
  const prods=DB.products.filter(p=>!q||p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q));
  const cartItems=Object.entries(cart).map(([id,qty])=>({p:DB.products.find(x=>x.id===id),qty})).filter(x=>x.p);
  const subtotal=cartItems.reduce((a,x)=>a+x.p.price*x.qty,0);
  const tax=subtotal*0.08, grand=subtotal+tax;
  c.innerHTML=`
    <div class="pos-grid">
      <div>
        <div class="scanbar"><span class="s-ico">📷</span><input id="posScan" placeholder="Scan or type a barcode / SKU, then press Enter…" autocomplete="off"><button class="btn ghost sm" id="posCam" type="button">📷 Camera</button></div>
        <div class="search" style="max-width:none;margin-bottom:16px"><span class="s-ico">🔍</span><input id="posSearch" placeholder="Search products to add…" value="${esc(posSearch)}"></div>
        <div class="pos-products">
          ${prods.map(p=>`<button class="pcard" data-add="${p.id}" ${p.stock<=0?'disabled':''}>
            <div class="pc-emoji">${p.emoji}</div>
            <div class="pc-name">${esc(p.name)}</div>
            <div class="pc-meta">${esc(p.cat)} · ${p.stock<=0?'<span style="color:var(--red)">Out</span>':p.stock+' left'}</div>
            <div class="pc-price">${money(p.price)}</div>
          </button>`).join('')}
        </div>
      </div>
      <div class="panel cart">
        <div class="panel-head"><h4>🛒 Current Sale</h4>${cartItems.length?'<button class="btn ghost sm" id="clearCart">Clear</button>':''}</div>
        <div class="panel-body">
          ${cartItems.length? cartItems.map(x=>`<div class="cart-item">
            <div style="font-size:22px">${x.p.emoji}</div>
            <div style="flex:1"><div class="ci-name">${esc(x.p.name)}</div><div class="ci-sub">${money(x.p.price)} each</div></div>
            <div class="qty"><button data-dec="${x.p.id}">−</button><span>${x.qty}</span><button data-inc="${x.p.id}">+</button></div>
          </div>`).join('') : '<div class="empty">Tap a product to start a sale.</div>'}
          ${cartItems.length?`
          <div style="margin-top:16px">
            <div class="cart-total"><span style="color:var(--muted)">Subtotal</span><span>${money(subtotal)}</span></div>
            <div class="cart-total"><span style="color:var(--muted)">Tax (8%)</span><span>${money(tax)}</span></div>
            <div class="cart-total grand"><span>Total</span><span>${money(grand)}</span></div>
            <button class="btn primary" id="checkout" style="width:100%;justify-content:center;margin-top:14px;padding:12px">Complete Sale · ${money(grand)}</button>
          </div>`:''}
        </div>
      </div>
    </div>`;
  const si=$('#posSearch'); si.oninput=()=>{ posSearch=si.value; const pos=si.selectionStart; viewPOS(c); const n=$('#posSearch'); n.focus(); n.setSelectionRange(pos,pos); };
  const scan=$('#posScan');
  if(scan){ scan.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=scan.value.trim(); scan.value=''; if(v){ posScanFocus=true; scanAdd(v,c); } } }; }
  const cam=$('#posCam'); if(cam) cam.onclick=()=>openScanner(c);
  if(posScanFocus){ const sc=$('#posScan'); if(sc) sc.focus(); posScanFocus=false; }
  c.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(b.dataset.add,c));
  c.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>addToCart(b.dataset.inc,c));
  c.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{ const id=b.dataset.dec; cart[id]--; if(cart[id]<=0) delete cart[id]; viewPOS(c); });
  const cc=$('#clearCart'); if(cc) cc.onclick=()=>{ cart={}; viewPOS(c); };
  const co=$('#checkout'); if(co) co.onclick=()=>checkout(c);
}
function addToCart(id,c){
  const p=DB.products.find(x=>x.id===id); if(!p||p.stock<=0) return;
  const cur=cart[id]||0; if(cur>=p.stock){ toast('Only '+p.stock+' in stock'); return; }
  cart[id]=cur+1; viewPOS(c);
}
function checkout(c){
  const items=Object.entries(cart).map(([id,qty])=>{ const p=DB.products.find(x=>x.id===id); return {id,name:p.name,qty,price:p.price}; });
  if(!items.length) return;
  const subtotal=items.reduce((a,i)=>a+i.price*i.qty,0); const total=subtotal*1.08;
  // decrement stock
  items.forEach(i=>{ const p=DB.products.find(x=>x.id===i.id); if(p) p.stock=Math.max(0,p.stock-i.qty); });
  const sale={id:(DB.nextSale++).toString(),ts:Date.now(),cashier:session.id,cashierName:session.name,items,total:Math.round(total*100)/100};
  DB.sales.push(sale); saveDB(); cart={};
  closeModal(); toast('Sale #'+sale.id+' completed · '+money(sale.total));
  showReceipt(sale.id);
  viewPOS(c);
}

/* ============================================================
   MODAL + INIT
   ============================================================ */
function openModal(title, bodyHTML, buttons){
  const m=$('#modal');
  m.innerHTML=`<div class="modal">
    <div class="modal-head"><h4>${esc(title)}</h4><button class="x" id="mClose">×</button></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot" id="mFoot"></div>
  </div>`;
  const foot=$('#mFoot');
  (buttons||[]).forEach(b=>{ const btn=document.createElement('button'); btn.className='btn '+b.cls; btn.textContent=b.label; btn.onclick=b.act; foot.appendChild(btn); });
  $('#mClose').onclick=closeModal;
  m.classList.add('show');
  m.onclick=e=>{ if(e.target===m) closeModal(); };
}
function closeModal(){ if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; } if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } const m=$('#modal'); m.classList.remove('show'); m.innerHTML=''; }

/* boot */
function restoreSession(){
  let sid=null;
  try{ sid=sessionStorage.getItem(SESSION_KEY); }catch(e){}
  if(!sid) sid=ssGet(SESSION_KEY);
  const user = sid ? DB.users.find(x=>x.id===sid) : null;
  if(user){
    session = user;
    activeView = user.role==='admin' ? 'dashboard' : 'pos';
    renderApp();
    maybeAutoAlert();
  } else {
    clearSession();
    renderLogin();
  }
}

/* Apply a dataset pushed from another device, keeping this user signed in. */
function applyCloudState(data){
  if(!data) return;
  cloudApplying = true;
  DB = data;
  if(!DB.settings) DB.settings = { alertEmail:'', ccEmail:'', storeName:'Elliana The Shop', autoAlertOnLogin:true };
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){}
  if(session){
    const me = DB.users.find(x=>x.id===session.id);
    if(me){ session = me; renderApp(); }
    else { session=null; clearSession(); renderLogin(); toast('Your account was changed \u2014 please sign in again'); }
  } else {
    renderLogin();
  }
  cloudApplying = false;
}

(async function boot(){
  loadDB(); /* show local data instantly */
  if(window.Cloud && Cloud.ready){
    try{
      const remote = await Cloud.loadState();
      if(remote){
        DB = remote;
        if(!DB.settings) DB.settings = { alertEmail:'', ccEmail:'', storeName:'Elliana The Shop', autoAlertOnLogin:true };
        try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){}
      } else {
        Cloud.saveState(DB); /* first run: seed the cloud from local defaults */
      }
      Cloud.subscribe(applyCloudState);
    }catch(e){ console.warn('Cloud load failed \u2014 using local data', e); }
  }
  restoreSession();
})();
</script>

/* Register the service worker for offline app support (HTTPS or localhost only). */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('[PWA] service worker registration failed', e);
    });
  });
}
